server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html;
    index index.php;
    charset utf-8;

    client_max_body_size 512M;

    # Permitir acceso directo a uploads multimedia
    location ^~ /data/uploads/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        location ~* \.php$ { deny all; return 404; }
    }

    # Proteger directorios y archivos internos
    location ~ ^/(data|src|cli|Docker)/ {
        deny all;
        return 404;
    }
    location ~ /\.(git|hg|svn|env) {
        deny all;
        return 404;
    }
    location ~* \.(db|sqlite|sqlite3|log|sql)$ {
        deny all;
        return 404;
    }
    location ~* ^/(release\.sh|changelog(\..*)?)$ {
        deny all;
        return 404;
    }
    location ~ ^/(cron|install)\.php$ {
        deny all;
        return 404;
    }

    # Streaming SSE sin gzip ni buffering
    location ^~ /api/v1/streaming {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        gzip off;
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # Assets dinámicos servidos por index.php
    location ~ ^/assets/pages\.(css|js)$ {
        try_files $uri /index.php$is_args$args;
    }

    # Caché de estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # Router principal de KutSocial
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }
}
