services:
  kutsocial:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: kutsocial
    ports:
      - "${KUTSOCIAL_PORT:-8080}:8080"
    volumes:
      - kutsocial_data:/var/www/html/data
    environment:
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/instance"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kutsocial_data:
    driver: local
